<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#080c10"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>

    <!-- Neon Text Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 212, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- Neon Glow Filter -->
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes lineDash {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodePulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.5); opacity: 1; filter: drop-shadow(0 0 8px #00f5d4); }
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .data-line {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: lineDash 4s ease-out forwards infinite alternate;
    }
    .pulse-node {
      animation: nodePulse 2.5s ease-in-out infinite;
      transform-origin: center;
    }
    .cursor {
      animation: cursorBlink 1s step-start infinite;
    }
    .title-text {
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .mono-text {
      font-family: 'IBM Plex Mono', monospace, Consolas, Courier;
    }
  </style>

  <!-- Canvas Base -->
  <rect width="900" height="320" fill="url(#bg)" rx="16"/>
  <rect width="900" height="320" fill="url(#grid)" rx="16"/>
  <rect x="1" y="1" width="898" height="318" fill="none" stroke="rgba(0, 245, 212, 0.2)" stroke-width="1.5" rx="15"/>

  <!-- Right Side Data Visualization Graphic -->
  <path d="M 500 230 Q 580 170, 660 200 T 840 90 L 840 260 L 500 260 Z" fill="rgba(0, 245, 212, 0.03)"/>
  <path class="data-line" d="M 500 230 Q 580 170, 660 200 T 840 90" fill="none" stroke="#00f5d4" stroke-width="3" filter="url(#neon)"/>

  <!-- Pulsing Graphic Nodes -->
  <circle cx="500" cy="230" r="4" fill="#00f5d4"/>
  <circle cx="580" cy="180" r="5" fill="#f5a623"/>
  <circle class="pulse-node" cx="660" cy="200" r="6" fill="#00f5d4"/>
  <circle cx="750" cy="130" r="4" fill="#00f5d4"/>
  <circle class="pulse-node" cx="840" cy="90" r="7" fill="#00f5d4"/>

  <!-- Overlay HUD Data Markers -->
  <text x="730" y="70" fill="#f5a623" class="mono-text" font-size="11" opacity="0.85">MAX_IMPACT: +$301K</text>
  <text x="640" y="235" fill="#00f5d4" class="mono-text" font-size="10" opacity="0.65">EFFIC_GAIN: 85%</text>

  <!-- Left Header Content -->
  <g transform="translate(45, 45)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="rgba(0, 245, 212, 0.08)" stroke="rgba(0, 245, 212, 0.3)"/>
    <circle cx="14" cy="13" r="4" fill="#00f5d4"/>
    <text x="28" y="17" fill="#00f5d4" class="mono-text" font-size="11" font-weight="600" letter-spacing="1">DATA &amp; BUSINESS ANALYST</text>
  </g>

  <!-- Name -->
  <text x="45" y="122" fill="url(#cyanGlow)" class="title-text" font-size="42" filter="url(#neon)">VIGHNESH MHATRE</text>

  <!-- Terminal Query Line -->
  <text x="45" y="160" fill="#e2e8f0" class="mono-text" font-size="13" opacity="0.95">
    <tspan fill="#00f5d4">$</tspan> python -m analyze --impact <tspan fill="#f5a623">"--auto=85% --profit=$301K"</tspan><tspan class="cursor" fill="#00f5d4">_</tspan>
  </text>

  <!-- Metric Glass Cards -->
  <g transform="translate(45, 188)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="130" height="54" rx="8" fill="#131b24" stroke="rgba(0, 245, 212, 0.18)"/>
    <text x="14" y="24" fill="#00f5d4" class="title-text" font-size="20">85%</text>
    <text x="14" y="41" fill="#6b7e99" class="mono-text" font-size="9.5" letter-spacing="0.5">REPORTING AUTO</text>

    <!-- Card 2 -->
    <rect x="142" y="0" width="145" height="54" rx="8" fill="#131b24" stroke="rgba(0, 245, 212, 0.18)"/>
    <text x="156" y="24" fill="#f5a623" class="title-text" font-size="20">$301K+</text>
    <text x="156" y="41" fill="#6b7e99" class="mono-text" font-size="9.5" letter-spacing="0.5">PROFIT OPPORTUNITY</text>

    <!-- Card 3 -->
    <rect x="299" y="0" width="130" height="54" rx="8" fill="#131b24" stroke="rgba(0, 245, 212, 0.18)"/>
    <text x="313" y="24" fill="#00f5d4" class="title-text" font-size="20">8.57</text>
    <text x="313" y="41" fill="#6b7e99" class="mono-text" font-size="9.5" letter-spacing="0.5">M.SC DATA SCIENCE</text>
  </g>

  <!-- Tech Stack Line -->
  <g transform="translate(45, 275)">
    <text x="0" y="14" fill="#6b7e99" class="mono-text" font-size="11" font-weight="600">STACK:</text>
    <text x="55" y="14" fill="#00f5d4" class="mono-text" font-size="11">SQL  ·  Python  ·  Power BI  ·  DAX  ·  VBA  ·  Streamlit  ·  Postman  ·  AWS</text>
  </g>
</svg>
